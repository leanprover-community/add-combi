name: Update Dependencies

on:
  schedule:
    - cron: "37 */6 * * *"   # Check for updates 37 minutes past every six hours
  workflow_dispatch:

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Open or update incompatibility PR
        uses: leanprover-community/downstream-reports/.github/actions/track-incompatibility@d0764abb5ca52756fe941e73e1e1cab4074b6047 # main as of 2026-09-28
        with:
          open-issue: false
          open-pr: true
